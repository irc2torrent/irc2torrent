; Default qBittorrent config for the flood_qbittorrent_irc2torrent image.
;
; Copied to <profile>/qBittorrent/config/qBittorrent.conf on first start, and
; ONLY if that file does not already exist. qBittorrent rewrites this file
; itself whenever a setting changes and again on shutdown, so re-seeding on
; every boot would silently discard everything you set in the WebUI.
;
; Anything with a command-line flag is deliberately NOT here: --profile,
; --webui-port and --confirm-legal-notice are passed by the supervisor, and the
; flag beats the file, so there is exactly one source of truth for each. Putting
; the port in both is how you end up with a readiness gate watching one port
; while the server listens on another.
;
; These are 5.x key names. QSettings ignores a key it does not recognise --
; silently, with no warning anywhere -- so a 4.x spelling here would look
; applied and do nothing. The image pins qbittorrent-nox 5.2.1 from Alpine 3.24;
; CI asserts the save path came back from /api/v2/app/preferences precisely
; because a build-time check cannot catch that class of mistake.

[LegalNotice]
Accepted=true

[BitTorrent]
Session\DefaultSavePath=/data
Session\Port=50000

[Preferences]
; Listen on every interface inside the container, so a published port reaches it.
WebUI\Address=*

; DOUBLE NEGATIVE, read it twice: the key means "require authentication for
; localhost", so false BYPASSES the login for connections from 127.0.0.1.
;
; That is what lets irc2torrent and Flood talk to it with empty credentials,
; which in turn avoids the alternative: qBittorrent 4.6.1+ generates a random
; temporary password on first start and prints it to stdout, and setting one
; non-interactively means writing a PBKDF2-HMAC-SHA512 hash into this file --
; a new crypto path to get wrong, to protect a loopback connection inside a
; single container.
;
; The bypass is keyed on the *peer address*, so a request arriving through a
; published port comes from the Docker bridge gateway rather than 127.0.0.1 and
; still meets the login form. Set a password in the WebUI anyway if you expose
; it beyond the host.
WebUI\LocalHostAuth=false
WebUI\CSRFProtection=true
